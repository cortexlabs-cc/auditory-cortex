name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build packages and examples
        run: npm run build
      - name: Typecheck
        run: npm run typecheck
      - name: Pack (dry run)
        run: |
          npm pack --dry-run -w @cortexlabs/auditory-cortex
          npm pack --dry-run -w @cortexlabs/auditory-cortex-r3f
